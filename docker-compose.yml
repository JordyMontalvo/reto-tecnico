services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customers-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
    networks:
      - customers-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customers-frontend
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - customers-net
    restart: unless-stopped

networks:
  customers-net:
    driver: bridge
